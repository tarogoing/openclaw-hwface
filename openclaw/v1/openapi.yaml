openapi: 3.1.0
info:
  title: OpenClaw v1 Conversation API
  version: 0.1.0
  description: >
    OpenAI-compatible OpenClaw Gateway v1 conversation surface used by
    openclaw-hwface. The Gateway also exposes a WebSocket node protocol for
    native companion clients; this file covers the HTTP chat compatibility
    endpoints only.
servers:
  - url: http://127.0.0.1:18789
    description: Local OpenClaw Gateway
  - url: http://10.0.2.2:18789
    description: Android emulator to host gateway bridge
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      summary: List OpenClaw-compatible models and agents
      operationId: listModels
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
  /v1/models/{model}:
    get:
      summary: Retrieve a model or agent alias
      operationId: getModel
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
          examples:
            default:
              value: openclaw/default
      responses:
        "200":
          description: Model metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
  /v1/chat/completions:
    post:
      summary: Send a chat-completions style turn to OpenClaw
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
  /v1/responses:
    post:
      summary: Send a responses-style turn to OpenClaw
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseRequest"
      responses:
        "200":
          description: OpenAI Responses-compatible response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ModelList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
      additionalProperties: true
    Model:
      type: object
      required:
        - id
        - object
      properties:
        id:
          type: string
          examples:
            - openclaw
            - openclaw/default
            - openclaw/main
        object:
          type: string
          examples:
            - model
        created:
          type: integer
        owned_by:
          type: string
          examples:
            - openclaw
      additionalProperties: true
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          examples:
            - openclaw/default
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: false
        temperature:
          type: number
        max_tokens:
          type: integer
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
      additionalProperties: true
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          examples:
            - chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          additionalProperties: true
      additionalProperties: true
    ResponseRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          examples:
            - openclaw/default
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        stream:
          type: boolean
          default: false
        instructions:
          type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
