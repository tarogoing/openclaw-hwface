<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Launcher</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <p class="eyebrow">OpenClaw</p>
      <h1 id="popupTitle">Right Panel Launcher</h1>
      <p id="popupDesc" class="muted">The main chat UI now lives in the browser right side panel. This popup stays as a quick launcher.</p>
      <button id="openPanelBtn" type="button">Open Right Side Panel</button>
      <button id="openSettings" type="button" class="ghost">Settings</button>
      <p id="status" class="status"></p>
    </main>
    <script src="./i18n.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
